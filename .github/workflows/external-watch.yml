name: external-watch
# Watches things outside this repo that the roadmap depends on and comments on
# the "Roadmap watch" issue only when the observed state changed since the last
# external-watch comment. Weekly. Never writes to git.
#
# Targets live in .github/external-watch.json (GitHub release tags, Wikidata
# external-id property labels, a version string on a web page). The workflow
# itself names no provider.
on:
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGETS: .github/external-watch.json
    steps:
      - uses: actions/checkout@v4
      - name: Observe every target
        id: obs
        run: |
          state=""
          while IFS=$'\t' read -r key repo; do
            v=$(curl -fsSL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/releases/latest" 2>/dev/null | jq -r '.tag_name // "none"' || echo unreachable)
            state+="$key: ${v:-none}"$'\n'
          done < <(jq -r '.github_releases[] | [.key,.repo] | @tsv' "$TARGETS")
          while IFS=$'\t' read -r key pattern; do
            q="SELECT ?p ?pLabel WHERE { ?p wikibase:propertyType wikibase:ExternalId . ?p rdfs:label ?pLabel FILTER(LANG(?pLabel)=\"en\") FILTER(REGEX(?pLabel,\"$pattern\",\"i\")) }"
            v=$(curl -fsSL -G "https://query.wikidata.org/sparql" --data-urlencode "query=$q" \
                -H "Accept: application/sparql-results+json" -H "User-Agent: openbook-external-watch/1.0" 2>/dev/null \
                | jq -r '[.results.bindings[] | "\(.p.value | sub(".*/";"")) \(.pLabel.value)"] | sort | join("; ")' || echo unreachable)
            state+="$key: ${v:-none}"$'\n'
          done < <(jq -r '.wikidata_external_id_labels[] | [.key,.pattern] | @tsv' "$TARGETS")
          while IFS=$'\t' read -r key url pattern; do
            v=$(curl -fsSL "$url" 2>/dev/null | grep -oiE "$pattern" | head -1 | sed 's/  */ /g' || true)
            state+="$key: ${v:-not parsed}"$'\n'
          done < <(jq -r '.pages[] | [.key,.url,.pattern] | @tsv' "$TARGETS")
          { echo "state<<EOF"; printf '%s' "$state"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Compare with the last external-watch comment
        id: cmp
        run: |
          n=$(gh issue list -R "$REPO" --label alert --state open --search "Roadmap watch in:title" --json number -q '.[0].number')
          [ -n "$n" ] || { echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "number=$n" >> "$GITHUB_OUTPUT"
          last=$(gh api "repos/$REPO/issues/$n/comments?per_page=100" \
                 --jq '[.[] | select(.body | startswith("**External watch"))] | last | .body // ""' \
                 | sed -n '/^```/,/^```/p' | sed '1d;$d')
          now="${{ steps.obs.outputs.state }}"
          if [ "$last" = "$now" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Comment on change
        if: steps.cmp.outputs.changed == 'true'
        run: |
          gh issue comment -R "$REPO" "${{ steps.cmp.outputs.number }}" --body "$(printf '**External watch, %s** @danhamilt — observed state changed.\n\n```\n%s\n```' "$(date -u +%F)" "${{ steps.obs.outputs.state }}")"
