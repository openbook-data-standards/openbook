name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install 'jsonschema>=4.18' referencing
      - run: python3 tools/validate.py

  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install 'jsonschema>=4.18' referencing
      - run: python3 tools/build_onboarding.py --check
      - run: python3 -m unittest discover -s tools -p 'test_onboarding.py'

  skill-installation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - agent: devin
            destination: .devin/skills
          - agent: claude-code
            destination: .claude/skills
          - agent: codex
            destination: .agents/skills
          - agent: cursor
            destination: .agents/skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install into an isolated project and compare bundled files
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          target="$(mktemp -d)"
          cd "$target"
          npx --yes skills@1.7.4 add "$GITHUB_WORKSPACE" --skill '*' --agent '${{ matrix.agent }}' --copy -y
          diff -r "$GITHUB_WORKSPACE/.devin/skills" "$target/${{ matrix.destination }}"

  site-fresh:
    # Fail if the committed HTML is stale: rebuild from the markdown/schema
    # sources and require no diff. Keeps generated pages in lockstep with the
    # canonical .md sources so a source edit can't merge without a rebuild.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install 'jsonschema>=4.18' referencing
      - run: python3 tools/build_site.py
      - run: python3 tools/build_onboarding.py --check --site
      - name: Committed HTML matches a fresh build
        run: |
          if [ -n "$(git status --porcelain -- '*.html')" ]; then
            echo "::error::Committed HTML is out of date. Run 'python3 tools/build_site.py' and commit the result."
            git --no-pager diff --stat -- '*.html'
            exit 1
          fi
