name: onboarding upstream audit
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-inventory-and-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install 'jsonschema>=4.18' referencing
      - run: python3 tools/build_onboarding.py --check --upstream
        env:
          GH_TOKEN: ${{ github.token }}
