name: milestone-watch
# Roadmap alerts. Every Monday: any open milestone that is overdue, or due within
# 21 days with open issues, and any open issue whose body carries a past
# "Due: YYYY-MM-DD" line, is reported as one comment on the "Roadmap watch"
# issue. No comment when nothing needs attention. Never writes to git.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  issues: read
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOON_DAYS: "21"
    steps:
      - name: Find the watch issue
        id: watch
        run: |
          n=$(gh issue list -R "$REPO" --label alert --state open --search "Roadmap watch in:title" --json number -q '.[0].number')
          if [ -z "$n" ]; then
            n=$(gh issue create -R "$REPO" --title "Roadmap watch" --label alert,roadmap \
              --body "Rolling alert thread for the milestone-watch and external-watch workflows." | sed 's#.*/##')
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - name: Check milestones and due lines
        id: check
        run: |
          today=$(date -u +%F); soon=$(date -u -d "+${SOON_DAYS} days" +%F)
          out=""
          while IFS=$'\t' read -r num title due open closed; do
            d=${due%%T*}
            if [ "$d" \< "$today" ]; then
              out+=$'\n'"- **Overdue milestone** [$title]($GITHUB_SERVER_URL/$REPO/milestone/$num) was due $d with $open open / $closed closed issues."
            elif [ "$d" \< "$soon" ] && [ "$open" -gt 0 ]; then
              out+=$'\n'"- **Due soon** [$title]($GITHUB_SERVER_URL/$REPO/milestone/$num) is due $d with $open open issues."
            fi
          done < <(gh api "repos/$REPO/milestones?state=open&per_page=100" \
                   --jq '.[] | select(.due_on != null) | [.number,.title,.due_on,.open_issues,.closed_issues] | @tsv')
          while IFS=$'\t' read -r num title d; do
            [ -n "$d" ] || continue
            if [ "$d" \< "$today" ]; then
              out+=$'\n'"- **Overdue issue** #$num $title (due $d)."
            elif [ "$d" \< "$soon" ]; then
              out+=$'\n'"- **Issue due soon** #$num $title (due $d)."
            fi
          done < <(gh issue list -R "$REPO" --label roadmap --state open --limit 200 --json number,title,body \
                   -q '.[] | [.number, .title, ((.body // "") | (try (capture("(?m)^Due: (?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})") | .d) catch ""))] | @tsv')
          {
            echo "report<<EOF"
            printf '%s\n' "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Comment when something needs attention
        if: steps.check.outputs.report != ''
        run: |
          gh issue comment -R "$REPO" "${{ steps.watch.outputs.number }}" --body "$(printf '**Roadmap watch, %s** @danhamilt\n%s' "$(date -u +%F)" "${{ steps.check.outputs.report }}")"
